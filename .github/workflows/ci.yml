name: "🧩 Continuous Integration"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [ "1.26.6" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Devbox
      uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

    - name: Verify pinned Go ${{ matrix.go-version }}
      run: test "$(devbox run -- go env GOVERSION)" = "go${{ matrix.go-version }}"

    - name: Report Go version
      run: devbox run -- go version

    - name: "🧹 Lint"
      run: devbox run -- make lint

    - name: "🧪 Test"
      run: devbox run -- make test

  required:
    name: CI
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Verify current Go
        run: test "${{ needs.test.result }}" = "success"
