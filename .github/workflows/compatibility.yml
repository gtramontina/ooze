name: "🔁 Go Compatibility"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go-version: [ "1.25.x" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Report Go version
        run: go version

      - name: Test
        run: env -u NO_COLOR TERM=xterm go test -race -cover -timeout=60s -shuffle=on ./...

  required:
    name: Compatibility
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Verify supported Go versions
        run: test "${{ needs.test.result }}" = "success"
