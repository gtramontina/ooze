name: "🖥️ OS Compatibility"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
    inputs:
      performance-baseline:
        description: Revision for the legacy A side of the performance comparison
        required: false
        default: 87c15dcb180492ba96f30278efc0146dd248f09b

permissions:
  contents: read

jobs:

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            acceptance-count: 6
            toolchain: devbox
            go-command: devbox run -- go
          - name: macOS 26
            runner: macos-26
            acceptance-count: 9
            toolchain: devbox
            go-command: devbox run -- go
          - name: Windows 2025
            runner: windows-2025
            acceptance-count: 8
            toolchain: raw-go
            go-command: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Devbox
        if: ${{ matrix.toolchain == 'devbox' }}
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Set up Go 1.26.6
        if: ${{ matrix.toolchain == 'raw-go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install gotestsum 1.13.0
        if: ${{ matrix.toolchain == 'raw-go' }}
        shell: bash
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Report Go version
        shell: bash
        run: ${{ matrix.go-command }} version

      - name: Verify pinned Go 1.26.6
        shell: bash
        run: test "$(${{ matrix.go-command }} env GOVERSION)" = "go1.26.6"

      - name: Test
        shell: bash
        run: ${{ matrix.go-command }} test -race -cover -timeout=60s -shuffle=on ./...

      - name: Native acceptance
        if: ${{ always() }}
        env:
          ACCEPTANCE_TESTS: ^(TestSupervisorDriverPreservesWaitFailureThatArrivesAfterDrainBound|TestNativeSupervisorDrainExpiryNeverManufacturesEmptiness|TestNativeSupervisorCapturePreservesPartialPrefixAndDiagnostic|TestNativeSupervisorDrainsWideFanout|TestDarwinManagedCensusInstrumentsPerDescendantShape|TestDarwinManagedPlatformLimitsRemainExplicit|TestDarwinNativeCommandCannotExecuteBeforeExplicitRelease|TestDarwinNativeSupervisorCapturesEscapeeBehindLiveGroupMember|TestDarwinNativeSupervisorEmergencyDrainsWithoutWaiter|TestLinuxNativeSupervisorReapsOrphanedEscapeeThroughGuardian|TestLinuxSubreaperVisibilityPerDescendantShapeAndRootState|TestWindowsNativeSupervisorRejectsBreakawayFromJob|TestWindowsNativeSupervisorDrainsChildInNestedJob|TestWindowsNativeJobKillOnCloseStopsExactSubject|TestWindowsJobVisibilityPerDescendantShapeAndRootState)$
        shell: bash
        run: |
          selected="$(${{ matrix.go-command }} test -tags=adversarial -list "$ACCEPTANCE_TESTS" ./internal/ooze | grep -c '^Test')"
          test "$selected" -eq "${{ matrix.acceptance-count }}"
          set +e
          ${{ matrix.go-command }} test -json -race -count=1 -timeout=3m -shuffle=on -tags=adversarial -run "$ACCEPTANCE_TESTS" ./internal/ooze | tee native-acceptance.json
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -q '"Action":"skip"' native-acceptance.json; then
            echo "unexpected skip in required native evidence" >&2
            exit 1
          fi

  stress:
    name: Stress / ${{ matrix.name }}
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    env:
      ACCEPTANCE_TESTS: ^(TestSupervisorDriverPreservesWaitFailureThatArrivesAfterDrainBound|TestNativeSupervisorDrainExpiryNeverManufacturesEmptiness|TestNativeSupervisorCapturePreservesPartialPrefixAndDiagnostic|TestNativeSupervisorDrainsWideFanout|TestDarwinManagedCensusInstrumentsPerDescendantShape|TestDarwinManagedPlatformLimitsRemainExplicit|TestDarwinNativeCommandCannotExecuteBeforeExplicitRelease|TestDarwinNativeSupervisorCapturesEscapeeBehindLiveGroupMember|TestDarwinNativeSupervisorEmergencyDrainsWithoutWaiter|TestLinuxNativeSupervisorReapsOrphanedEscapeeThroughGuardian|TestLinuxSubreaperVisibilityPerDescendantShapeAndRootState|TestWindowsNativeSupervisorRejectsBreakawayFromJob|TestWindowsNativeSupervisorDrainsChildInNestedJob|TestWindowsNativeJobKillOnCloseStopsExactSubject|TestWindowsJobVisibilityPerDescendantShapeAndRootState)$
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
          - name: macOS 26
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
          - name: Windows 2025
            runner: windows-2025
            toolchain: raw-go
            go-command: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Devbox
        if: ${{ matrix.toolchain == 'devbox' }}
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Set up Go 1.26.6
        if: ${{ matrix.toolchain == 'raw-go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify pinned Go 1.26.6
        shell: bash
        run: test "$(${{ matrix.go-command }} env GOVERSION)" = "go1.26.6"

      - name: Repeat bounded native acceptance
        shell: bash
        run: |
          set +e
          ${{ matrix.go-command }} test -json -race -count=10 -timeout=10m -shuffle=on -tags=adversarial -run "$ACCEPTANCE_TESTS" ./internal/ooze | tee native-stress.json
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -q '"Action":"skip"' native-stress.json; then
            echo "unexpected skip in required native evidence" >&2
            exit 1
          fi

  performance:
    name: Performance evidence / ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    env:
      PERFORMANCE_SAMPLES: 10
      PERFORMANCE_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu-24.04
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
          - name: macOS-26
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
          - name: Windows-2025
            runner: windows-2025
            toolchain: raw-go
            go-command: go
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: performance-candidate

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.performance-baseline || '87c15dcb180492ba96f30278efc0146dd248f09b' }}
          path: performance-baseline

      - name: Install Devbox
        if: ${{ matrix.toolchain == 'devbox' }}
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          project-path: performance-candidate

      - name: Set up Go 1.26.6
        if: ${{ matrix.toolchain == 'raw-go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: performance-candidate/go.sum

      - name: Verify pinned Go 1.26.6
        shell: bash
        working-directory: performance-candidate
        run: test "$(${{ matrix.go-command }} env GOVERSION)" = "go1.26.6"

      - name: Collect interleaved A/B samples
        shell: bash
        run: performance-candidate/.github/performance/collect.sh performance-baseline performance-candidate performance.jsonl

      - name: Upload raw performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ matrix.name }}
          path: performance.jsonl
          if-no-files-found: error
          retention-days: 30

  mutation-evidence:
    name: Mutation evidence / ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / repository
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: repository
            mutation-test: TestMutationRepository
          - name: Ubuntu 24.04 / attempt-system
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: attempt-system
            mutation-test: TestMutationAttemptSystem
          - name: Ubuntu 24.04 / campaign-runner
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-runner
            mutation-test: TestMutationCampaignRunner
          - name: Ubuntu 24.04 / campaign-cycle
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-cycle
            mutation-test: TestMutationCampaignCycle
          - name: Ubuntu 24.04 / campaign-emergency
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-emergency
            mutation-test: TestMutationCampaignEmergency
          - name: Ubuntu 24.04 / campaign-effects
            runner: ubuntu-24.04
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-effects
            mutation-test: TestMutationCampaignEffects
          - name: macOS 26 / repository
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: repository
            mutation-test: TestMutationRepository
          - name: macOS 26 / attempt-system
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: attempt-system
            mutation-test: TestMutationAttemptSystem
          - name: macOS 26 / campaign-runner
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-runner
            mutation-test: TestMutationCampaignRunner
          - name: macOS 26 / campaign-cycle
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-cycle
            mutation-test: TestMutationCampaignCycle
          - name: macOS 26 / campaign-emergency
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-emergency
            mutation-test: TestMutationCampaignEmergency
          - name: macOS 26 / campaign-effects
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: campaign-effects
            mutation-test: TestMutationCampaignEffects
          - name: macOS 26 / darwin
            runner: macos-26
            toolchain: devbox
            go-command: devbox run -- go
            catalogue-shard: darwin
            mutation-test: TestMutationPlatform
          - name: Windows 2025 / repository
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: repository
            mutation-test: TestMutationRepository
          - name: Windows 2025 / attempt-system
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: attempt-system
            mutation-test: TestMutationAttemptSystem
          - name: Windows 2025 / campaign-runner
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: campaign-runner
            mutation-test: TestMutationCampaignRunner
          - name: Windows 2025 / campaign-cycle
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: campaign-cycle
            mutation-test: TestMutationCampaignCycle
          - name: Windows 2025 / campaign-emergency
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: campaign-emergency
            mutation-test: TestMutationCampaignEmergency
          - name: Windows 2025 / campaign-effects
            runner: windows-2025
            toolchain: raw-go
            go-command: go
            catalogue-shard: campaign-effects
            mutation-test: TestMutationCampaignEffects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Devbox
        if: ${{ matrix.toolchain == 'devbox' }}
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Set up Go 1.26.6
        if: ${{ matrix.toolchain == 'raw-go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify pinned Go 1.26.6
        shell: bash
        run: test "$(${{ matrix.go-command }} env GOVERSION)" = "go1.26.6"

      - name: Install gotestsum 1.13.0
        if: ${{ matrix.toolchain == 'raw-go' }}
        shell: bash
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Mutation campaign acceptance
        shell: bash
        run: ${{ matrix.go-command }} test -timeout=30m -count=1 -v -tags=mutation -run=^${{ matrix.mutation-test }}$

  required:
    name: OS Compatibility
    if: ${{ always() }}
    needs: [ test, stress ]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify supported operating systems
        run: test "${{ needs.test.result }}" = "success" && { test "${{ needs.stress.result }}" = "success" || { test "${{ github.event_name }}" = "pull_request" && test "${{ needs.stress.result }}" = "skipped"; }; }
